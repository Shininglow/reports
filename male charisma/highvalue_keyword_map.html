<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>High Value Man — Keyword Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080c14;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow-x: auto;
}
h1 {
  text-align: center;
  color: #F59E0B;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  padding: 28px 0 6px;
}
.subtitle {
  text-align: center;
  color: #374151;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding-bottom: 0;
}

#wrap {
  position: relative;
  width: 2300px;
  height: 2300px;
  margin: 0 auto;
}
svg#lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ── Center ── */
.center-node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 172px; height: 172px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #FBBF24, #B45309);
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  color: #1c0a00;
  font-size: 14px; font-weight: 900;
  letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.4;
  box-shadow: 0 0 80px rgba(245,158,11,0.5), 0 0 160px rgba(245,158,11,0.15);
  z-index: 20;
}

/* ── Cluster badge ── */
.badge {
  position: absolute;
  transform: translate(-50%, -50%);
  border-radius: 6px;
  padding: 7px 14px;
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 0.6px; text-transform: uppercase;
  text-align: center; white-space: nowrap;
  border: 1.5px solid; z-index: 12;
  line-height: 1.4;
}

/* ── Keyword panel ── */
.panel {
  position: absolute;
  transform: translate(-50%, -50%);
  background: rgba(8, 12, 22, 0.97);
  border-radius: 10px;
  border-top: 3px solid;
  border-left: 1px solid rgba(255,255,255,0.06);
  border-right: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 13px 15px 15px;
  width: 232px;
  z-index: 9;
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: default;
}
.panel:hover {
  transform: translate(-50%, -50%) scale(1.03);
  z-index: 100;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.panel-header {
  font-size: 9.5px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.8px;
  padding-bottom: 9px;
  margin-bottom: 9px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.panel-list {
  list-style: none;
  display: flex; flex-direction: column; gap: 6px;
}
.panel-list li {
  font-size: 10.5px; line-height: 1.35;
  padding-left: 13px;
  position: relative; opacity: 0.78;
}
.panel-list li::before {
  content: '›';
  position: absolute; left: 0;
  opacity: 0.45; font-size: 13px; line-height: 1.2;
}

/* ── Legend ── */
#legend {
  display: flex; flex-wrap: wrap;
  justify-content: center; gap: 8px 22px;
  padding: 14px 40px 44px;
  max-width: 1400px; margin: 0 auto;
}
.leg { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #6B7280; }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

/* helpers */
function rad(deg) { return (deg - 90) * Math.PI / 180; }
function pt(r, angleDeg) {
  const a = rad(angleDeg);
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
}

const svg    = document.getElementById("lines");
const nodes  = document.getElementById("nodes");
const legend = document.getElementById("legend");

function svgLine(x1,y1,x2,y2,color,opacity,w) {
  const el = document.createElementNS("http://www.w3.org/2000/svg","line");
  el.setAttribute("x1",x1); el.setAttribute("y1",y1);
  el.setAttribute("x2",x2); el.setAttribute("y2",y2);
  el.setAttribute("stroke",color);
  el.setAttribute("stroke-opacity", opacity ?? 0.3);
  el.setAttribute("stroke-width",   w ?? 1);
  svg.appendChild(el);
}

function div(cls, x, y, html, styles) {
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = html;
  d.style.left = x + "px";
  d.style.top  = y + "px";
  if (styles) Object.assign(d.style, styles);
  nodes.appendChild(d);
  return d;
}

/* center */
div("center-node", CX, CY, "HIGH<br>VALUE<br>MAN");

clusters.forEach(cl => {
  const bp = pt(BADGE_R, cl.angle);  // badge position
  const pp = pt(PANEL_R, cl.angle);  // panel position

  /* lines */
  svgLine(CX, CY, bp.x, bp.y, cl.color, 0.5, 1.8);
  svgLine(bp.x, bp.y, pp.x, pp.y, cl.color, 0.3, 1.2);

  /* badge */
  div("badge", bp.x, bp.y, cl.label.replace(/\n/g,"<br>"), {
    background: cl.bg,
    borderColor: cl.border,
    color: cl.color,
    boxShadow: `0 0 14px ${cl.bg}`,
  });

  /* panel */
  const panel = div("panel", pp.x, pp.y, "", {
    borderTopColor: cl.color,
  });
  panel.innerHTML = `
    <div class="panel-header" style="color:${cl.color}">${cl.label.replace(/\n/g," ")}</div>
    <ul class="panel-list" style="color:${cl.color}">
      ${cl.kws.map(k => `<li>${k}</li>`).join("")}
    </ul>`;

  /* legend */
  const li = document.createElement("div");
  li.className = "leg";
  li.innerHTML = `<div class="leg-dot" style="background:${cl.color}"></div>${cl.label.replace(/\n/g," ")}`;
  legend.appendChild(li);
});
</script>
</body>
</html>
